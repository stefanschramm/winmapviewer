name: Build Windows application

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            make \
            mingw-w64 \
            libz-mingw-w64 \
            g++-mingw-w64

      - name: Build 32-bit executable
        run: make ARCH=i686

      - name: Build 64-bit executable
        run: make ARCH=x86_64

      - name: Upload Windows executables
        uses: actions/upload-artifact@v5
        with:
          name: winmapviewer
          path: |
            build/i686/winmapviewer.exe
            build/x86_64/winmapviewer.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executables
        uses: actions/download-artifact@v5
        with:
          path: build

      - name: Prepare versioned release assets
        run: |
          cp build/i686/winmapviewer.exe "build/winmapviewer-i686-${GITHUB_REF_NAME}.exe"
          cp build/x86_64/winmapviewer.exe "build/winmapviewer-x86_64-${GITHUB_REF_NAME}.exe"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "build/winmapviewer-i686-${GITHUB_REF_NAME}.exe"
          "build/winmapviewer-x86_64-${GITHUB_REF_NAME}.exe"
          --title "winmapviewer $GITHUB_REF_NAME"
          --generate-notes